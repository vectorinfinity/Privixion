name: Source checks and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python scripts/check_publication.py --tracked
      - run: python -m unittest discover -s scripts/tests -v

  frontend:
    needs: publication-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    needs: publication-check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build isolated test image
        run: docker build -t privixion-tests ./backend
      - name: Run complete offline test suite with temporary test keys
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:size=2g,mode=1777 --memory 4g --cpus 4
          -v "${{ github.workspace }}/scripts:/scripts:ro"
          privixion-tests python -m pytest -q -p no:cacheprovider
